# General  
train_2d: False
no_eval: False
finetune: True 
partial_train: null
train_mode: mono
nb_views: 1
model_type: og

# Traning 
epochs: 120
checkpoint_frequency: 30
batch_size: 16 
dropout: 0.2
learning_rate: 0.0002 #init:0.0002
weight_decay: 0.01
lr_decay: 0.99
save_best: True

# Model
backbone: "PoseMamba"
maxlen: 243
dim_feat: 128 
mlp_ratio: 2 
depth: 20 
att_fuse: True

# Data
data_root: data/motion3d/MB3D_f243s81/
subset_list: [DATA-SH]
dt_file: data.pkl
clip_len: 81
data_stride: 81
rootrel: False
sample_stride: 1
num_joints: 17
no_conf: True 
gt_2d: False

# Loss
lambda_3d_velocity: 20.0
lambda_scale: 0.5
lambda_lv: 0.0
lambda_lg: 0.0
lambda_a: 0.0
lambda_av: 0.0
lambda_3dw: 0.0
lambda_3d: 1.0
lambda_diff: 0.5
lambda_reproj: 1.0
lambda_view: 1.
lambda_depth: 1.

# Augmentation
synthetic: False
flip: True
mask_ratio: 0.
mask_T_ratio: 0.
noise: False
rotation: False
scheduler: exp
tau: 70 #In epochs

